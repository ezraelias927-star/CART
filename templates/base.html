<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Duka Letu{% endblock %}</title>
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFF9F4;
    --border:#EFE6DC;
    --text:#241F1B;
    --text-muted:#85786C;
    --orange:#FF5A1F;
    --orange-dark:#E24A0F;
    --orange-soft:#FFE7D9;
    --radius-sm:8px;
    --radius-md:14px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family: Arial, sans-serif;
    color:var(--text);
    background:var(--bg);
  }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; }

  /* ---------- NAVBAR (Brand + Icons) ---------- */
  .top-navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 24px;
    border-bottom:1px solid var(--border);
  }
  .brand{ font-size:1.25rem; font-weight:bold; color:var(--orange-dark); }
  .nav-icons{ display:flex; align-items:center; gap:18px; }
  .icon-btn{
    background:none; border:none;
    font-size:1.3rem;
    position:relative;
    color:var(--text);
  }
  .cart-count{
    position:absolute;
    top:-6px; right:-10px;
    background:var(--orange);
    color:#fff;
    font-size:0.7rem;
    font-weight:bold;
    padding:1px 6px;
    border-radius:999px;
  }
  .icon-btn.favorited{ color:var(--orange); }

  /* ---------- SEARCH BAR ---------- */
  .search-bar-wrap{ padding:12px 24px; border-bottom:1px solid var(--border); }
  .search-bar-wrap input{
    width:100%;
    max-width:520px;
    padding:10px 14px;
    border:1px solid var(--border);
    border-radius:999px;
    font-size:0.95rem;
  }
  .search-bar-wrap input:focus{ outline:none; border-color:var(--orange); }

  /* ---------- CATEGORY TABS ---------- */
  .category-bar{
    display:flex;
    gap:10px;
    padding:12px 24px;
    overflow-x:auto;
    border-bottom:1px solid var(--border);
  }

  .page-overlay{
  position:fixed;
  top:0; right:0; bottom:0; left:0;
  background:rgba(36,31,27,0.4);
  z-index:150;
}
.page-overlay[hidden]{ display:none; }

  .category-pill{
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--border);
    font-size:0.85rem;
    white-space:nowrap;
  }
  .category-pill.active,
  .category-pill:hover{
    background:var(--orange-soft);
    color:var(--orange-dark);
    border-color:var(--orange-soft);
  }

  /* ---------- MAIN CONTENT ---------- */
  main{ padding:24px; }

  /* ---------- CART PANEL (dropdown chini ya icon ya cart) ---------- */
  .cart-panel{
    position:fixed;
    top:64px; right:16px;
    width:300px;
    max-height:70vh;
    overflow-y:auto;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    box-shadow:0 12px 28px rgba(36,31,27,0.15);
    padding:16px;
    display:none;
    z-index:300;
  }
  .cart-panel.open{ display:block; }
  #favoritesPanel{ right:330px; }
  .cart-panel h3{ margin:0 0 12px; font-size:1rem; }
  .cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid var(--border);
    font-size:0.85rem;
  }
  .cart-item button{
    background:none; border:none;
    color:var(--orange-dark);
    font-size:0.8rem;
  }
  .cart-empty{ color:var(--text-muted); font-size:0.85rem; }
  .cart-total{
    display:flex; justify-content:space-between;
    margin-top:12px; font-weight:bold;
  }

  /* ---------- FOOTER ---------- */
  footer{
    border-top:1px solid var(--border);
    padding:20px 24px;
    text-align:center;
    color:var(--text-muted);
    font-size:0.85rem;
  }

  @media (max-width:600px){
    .top-navbar{ padding:12px 16px; }
    main{ padding:16px; }
    #favoritesPanel{ right:16px; left:16px; width:auto; }
    .cart-panel{ right:16px; left:16px; width:auto; }
  }

  .welcome-marquee{
    overflow:hidden;
    white-space:nowrap;
    background:var(--orange-soft);
    border-bottom:1px solid var(--border);
    padding:8px 0;
  }
  .welcome-marquee span{
    display:inline-block;
    padding-left:100%;
    color:var(--orange-dark);
    font-weight:600;
    font-size:0.88rem;
    animation: marqueeScroll 14s linear infinite;
  }
  @keyframes marqueeScroll{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(-100%); }
  }
</style>
</head>
<body>

<nav class="top-navbar">
  <a href="{{ url_for('home') }}" class="brand">Duka Letu</a>
  <div class="nav-icons">
    <button class="icon-btn" id="favoritesToggleBtn" title="Vipendwa">
      &#9825;
      <span class="cart-count" id="favoritesCount">0</span>
    </button>
    <a class="icon-btn" title="Akaunti" href="/auth">&#128100;</a>
    <button class="icon-btn" id="cartToggleBtn" title="Cart">
      &#128722;
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</nav>

<div class="search-bar-wrap">
  <input type="text" id="searchInput" placeholder="Tafuta bidhaa...">
</div>

<div class="welcome-marquee">
  <span>Karibu katika duka letu bora &nbsp; &#8226; &nbsp; Bidhaa bora, bei nzuri &nbsp; &#8226; &nbsp; Karibu katika duka letu bora</span>
</div>

<!-- FAVORITES PANEL: inaonekana/kufichwa unapobonyeza icon ya moyo -->
<div class="cart-panel" id="favoritesPanel">
  <h3>Vipendwa Vyako</h3>
  <div id="favoritesItemsList"></div>
</div>

<!-- CART PANEL: inaonekana/kufichwa unapobonyeza icon ya cart -->
<div class="cart-panel" id="cartPanel">
  <h3>Bidhaa Zako</h3>
  <div id="cartItemsList"></div>
  <div class="cart-total" id="cartTotal" hidden>
    <span>Jumla</span>
    <span id="cartTotalAmount">Tsh 0</span>
  </div>
  <button id="cartSubmitBtn" class="cart-submit-btn" style="width:100%;margin-top:14px;padding:12px;background:#FF5A1F;color:#fff;border:none;border-radius:8px;font-weight:600;">Endelea na Malipo</button>
</div>

<div class="page-overlay" id="pageOverlay" hidden></div>

<main>
  {% block content %}
  <!-- Kurasa nyingine (mfano orodha ya bidhaa) zita-extend base.html hii -->
  {% endblock %}
</main>

<footer>
  &copy; <span id="year"></span> Duka Letu. Haki zote zimehifadhiwa.
</footer>

<!-- Sehemu ya chini kabisa ya base.html -->
<script>
  window.isLoggedIn = {{ 'true' if session.get('user_id') else 'false' }};
</script>
<script src="{{ url_for('static', filename='js/components/cart.js') }}"></script>
<script src="{{ url_for('static', filename='js/components/favorites.js') }}"></script>
<script src="{{ url_for('static', filename='js/api/orderApi.js') }}"></script>
<script src="{{ url_for('static', filename='js/layout.js') }}" defer></script>

{% block extra_js %}{% endblock %}
</body>
</html>
