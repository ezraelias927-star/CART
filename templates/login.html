<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Dashboard Portal</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN kwa ajili ya icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content: center min-vh-100 py-4" style="background: radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.08) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.1) 0px, transparent 50%), #f8fafc;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <!-- Login Card -->
                <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white">
                    
                    <!-- Header / Logo Section -->
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center text-white rounded-4 mb-3 shadow" style="width: 60px; height: 60px; background: linear-gradient(135deg, #fd7e14, #ffc107);">
                            <i class="bi bi-shield-lock fs-3"></i>
                        </div>
                        <h2 class="fw-bold text-dark fs-3">Admin Portal</h2>
                        <p class="text-muted small">Ingiza taarifa zako ili kuingia kwenye mfumo</p>
                    </div>

                    <!-- Flask Flash Messages Support -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% if messages %}
                        <div class="mb-3">
                          {% for category, message in messages %}
                            <div class="alert alert-{{ 'danger' if category == 'danger' or category == 'error' else ('success' if category == 'success' else 'warning') }} py-2 px-3 small text-center rounded-3 mb-2" role="alert">
                                {{ message }}
                            </div>
                          {% endfor %}
                        </div>
                      {% endif %}
                    {% endwith %}

                    <!-- Login Form -->
                    <form action="{{ url_for('admin_login') }}" method="POST">
                        
                        <!-- Username Field -->
                        <div class="mb-3">
                            <label for="username" class="form-label text-secondary fw-semibold small text-uppercase">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted rounded-start-3">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" class="form-control bg-light border-start-0 ps-0 shadow-none" id="username" name="username" placeholder="Ingiza username" required autocomplete="off">
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div class="mb-4">
                            <label for="password" class="form-label text-secondary fw-semibold small text-uppercase">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted rounded-start-3">
                                    <i class="bi bi-key"></i>
                                </span>
                                <input type="password" class="form-control bg-light border-start-0 border-end-0 ps-0 shadow-none" id="password" name="password" placeholder="Ingiza password" required>
                                <button class="btn btn-outline-secondary border-start-0 bg-light text-muted rounded-end-3" type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()">
                                    <i class="bi bi-eye" id="eyeIcon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn text-white fw-bold py-3 rounded-3 shadow-sm" style="background: linear-gradient(135deg, #fd7e14, #ffc107);">
                                Ingia Mfumoni
                            </button>
                        </div>
                    </form>

                    <!-- Footer -->
                    <div class="text-center mt-4 text-muted small">
                        &copy; Mfumo wa Admin &bull; Haki zote zimehifadhiwa
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript ndogo ya ku-Toggle Password Visibility -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('bi-eye');
                eyeIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('bi-eye-slash');
                eyeIcon.classList.add('bi-eye');
            }
        }
    </script>
</body>
</html>
