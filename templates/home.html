{% extends "base.html" %}

{% block title %}Nyumbani | Duka Letu{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">

<!-- home.html inabeba containers tu; maudhui yanajazwa na modules -->
<section id="hero" class="hero" aria-label="Karibu"></section>
<section id="category" class="home-section" aria-label="Kategoria"></section>
<section id="products" class="home-section" aria-labelledby="products-heading" aria-busy="true">
  <h2 id="products-heading" class="section-title">Bidhaa</h2>
  <p id="loadingText" role="status" hidden></p>
  <div class="product-grid" id="productGrid"></div>
</section>
<section id="services" class="home-section" aria-label="Huduma"></section>
{% endblock %}

{% block extra_js %}
<script type="module" src="{{ url_for('static', filename='js/components/main.js') }}"></script>
{% endblock %}
