{% extends "base.html" %}

{% block title %}Nyumbani | Duka Letu{% endblock %}

{% block content %}
<style>
  .product-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap:18px;
  }
  .product-card{
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    overflow:hidden;
    background:var(--bg);
    position:relative;
  }
  .product-card img{
    width:100%;
    height:160px;
    object-fit:cover;
    display:block;
    background:var(--surface);
  }
  .favorite-btn{
    position:absolute;
    top:8px; right:8px;
    background:rgba(255,255,255,0.9);
    border:none;
    border-radius:50%;
    width:34px; height:34px;
    font-size:1.1rem;
  }
  .favorite-btn.favorited{ color: var(--orange); }
  .product-info{ padding:12px; }
  .product-name{ font-weight:bold; font-size:0.92rem; margin:0 0 4px; }
  .product-price{ color:var(--orange-dark); font-weight:bold; margin:0 0 10px; }
  .add-to-cart-btn{
    width:100%;
    padding:9px;
    background:var(--orange);
    color:#fff;
    border:none;
    border-radius:var(--radius-sm);
    font-weight:600;
  }
  .add-to-cart-btn:hover{ background:var(--orange-dark); }
  #loadingText{ color:var(--text-muted); }
</style>

<p id="loadingText">Inapakia bidhaa...</p>
<div class="product-grid" id="productGrid"></div>
{% endblock %}

{% block extra_js %}
<script>
  // =====================================================================
  // HOME PAGE LOGIC (function moja = kazi moja)
  // =====================================================================

  // Tunahifadhi ID ya "timer" ya debounce, ili tusitume request kwa kila herufi.
  let searchDebounceTimer = null;

  // Inatengeneza URL sahihi ya API - na search parameter kama ipo.
  function buildProductsUrl(searchTerm) {
    if (!searchTerm) return '/api/searchproducts';
    return '/api/searchproducts?search=' + encodeURIComponent(searchTerm);
  }

  // Inaonyesha ujumbe wa "inapakia/inatafuta" kwa mtumiaji.
  function showLoading(message) {
    const loadingText = document.getElementById('loadingText');
    loadingText.textContent = message;
    loadingText.style.display = 'block';
  }

  // Inaficha ujumbe wa "inapakia/inatafuta".
  function hideLoading() {
    document.getElementById('loadingText').style.display = 'none';
  }

  // Inaomba bidhaa kutoka server - na search term ikiwa ipo.
  async function loadProducts(searchTerm = '') {
    showLoading(searchTerm ? 'Inatafuta...' : 'Inapakia bidhaa...');

    try {
      const url = buildProductsUrl(searchTerm);
      const response = await fetch(url);
      const products = await response.json();
      hideLoading();
      renderProductGrid(products);
    } catch (error) {
      showLoadError();
    }
  }

  // Inaonyesha ujumbe wa error endapo fetch imeshindwa.
  function showLoadError() {
    showLoading('Imeshindwa kupakia bidhaa. Jaribu tena.');
  }

  // Inachukua list ya bidhaa na kuzichora kwenye grid.
  function renderProductGrid(products) {
    const grid = document.getElementById('productGrid');

    if (products.length === 0) {
      grid.innerHTML = '<p>Hakuna bidhaa zinazofanana na utafutaji wako.</p>';
      return;
    }

    grid.innerHTML = products.map(createProductCardHTML).join('');
    syncAllFavoriteIcons(products);
  }

  // Inatengeneza HTML ya kadi moja ya bidhaa.
  function createProductCardHTML(product) {
    const image = product.image_url || 'https://placehold.co/300x200';

    return `
      <div class="product-card">
        <button class="favorite-btn" data-fav-id="${product.id}"
          onclick="toggleFavorite('${product.id}', '${product.name}', ${product.price})">
          &#9825;
        </button>
        <img src="${image}" alt="${product.name}">
        <div class="product-info">
          <p class="product-name">${product.name}</p>
          <p class="product-price">Tsh ${Number(product.price).toLocaleString()}</p>
          <button class="add-to-cart-btn"
            onclick="addToCart('${product.id}', '${product.name}', ${product.price},'${image}',this)">
            Ongeza kwenye Cart
          </button>
        </div>
      </div>
    `;
  }

  // Inaonyesha moyo "umejaa" kwa bidhaa zilizokwishawekwa favorites tangu awali.
  function syncAllFavoriteIcons(products) {
    products.forEach(function(product){
      const alreadyFavorited = isFavorited(String(product.id));
      syncFavoriteButtons(String(product.id), alreadyFavorited);
    });
  }

  // ---------------------------------------------------------------------
  // SEARCH (dynamic - kila mtu anapoandika, request halisi inatumwa server)
  // ---------------------------------------------------------------------

  // Inaitwa kila mtu anapoandika kwenye search bar.
  // Inasubiri milisekunde 300 baada ya mtu kuacha kuandika, kisha ndipo inatuma request
  // (debounce) - hii inazuia kutuma request kwa kila herufi moja moja.
  function handleSearchInput(event) {
    clearTimeout(searchDebounceTimer);

    const searchTerm = event.target.value.trim();
    searchDebounceTimer = setTimeout(() => loadProducts(searchTerm), 300);
  }

  // ---------------------------------------------------------------------
  // INITIALIZATION
  // ---------------------------------------------------------------------
  document.addEventListener('DOMContentLoaded', function(){
    loadProducts();
    document.getElementById('searchInput').addEventListener('input', handleSearchInput);
  });
</script>
{% endblock %}
