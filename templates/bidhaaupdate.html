{% extends "adminbase.html" %}

{% block title %}Bidhaa Zote | Duka Admin{% endblock %}

{% block content %}
<style>
  .table-wrap{ border:1px solid var(--border); border-radius:var(--radius-md); overflow-x:auto; background:var(--bg); }
  table.data-table{ width:100%; border-collapse:collapse; min-width:640px; }
  .data-table thead th{ text-align:left; font-size:0.8rem; font-weight:600; color:var(--text-muted); padding:14px 16px; border-bottom:1px solid var(--border); background:var(--surface); }
  .data-table tbody td{ padding:12px 16px; border-bottom:1px solid var(--border); font-size:0.9rem; }
  .prod-thumb{ width:40px; height:40px; border-radius:8px; object-fit:cover; }
  .icon-btn{ padding:7px 12px; border-radius:8px; font-size:0.82rem; font-weight:600; border:1px solid var(--border); background:var(--bg); }
  .icon-btn:hover{ border-color:var(--orange); color:var(--orange-dark); }
  .icon-btn.danger:hover{ border-color:var(--danger); color:var(--danger); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(36,31,27,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:200; }
  .modal-backdrop[hidden]{ display:none; }
  .modal-box{ background:var(--bg); border-radius:var(--radius-md); padding:26px; width:100%; max-width:420px; }
</style>

<div class="page-head">
  <div>
    <h1>Bidhaa Zote</h1>
    <p class="page-sub">Hariri au futa bidhaa zilizopo dukani.</p>
  </div>
  <a href="{{ url_for('bidhaa_page') }}" class="link-back">+ Ongeza bidhaa</a>
</div>

<div class="table-wrap">
  <table class="data-table">
    <thead>
      <tr>
        <th>Picha</th><th>Jina</th><th>Kategoria</th><th>Bei</th><th>Stoo</th><th>Vitendo</th>
      </tr>
    </thead>
    <!-- Jedwali hili linaanza tupu. JS ndiyo itakayolijaza baada ya kupata data kwa fetch(). -->
    <tbody id="productTableBody">
      <tr><td colspan="6">Inapakia bidhaa...</td></tr>
    </tbody>
  </table>
</div>

<!-- Popup ya kuhariri bidhaa. Inafichwa kwa "hidden" mpaka mtu abonyeze "Hariri". -->
<div class="modal-backdrop" id="editModal" hidden>
  <div class="modal-box">
    <h2>Hariri bidhaa</h2>
    <form id="editForm">
      <label for="editName">Jina la bidhaa</label>
      <input type="text" id="editName" required>

      <label for="editCategory">Kategoria</label>
      <select id="editCategory" required></select>
      <!-- <option> zake zitajazwa na JS kwa fetch('/admin/api/categories') -->

      <div class="form-row">
        <div>
          <label for="editPrice">Bei (Tsh)</label>
          <input type="number" id="editPrice" min="0" step="0.01" required>
        </div>
        <div>
          <label for="editStock">Idadi stoo</label>
          <input type="number" id="editStock" min="0" step="1" required>
        </div>
      </div>

      <label for="editImage">Picha (URL)</label>
      <input type="url" id="editImage">
      <span class="field-error" id="editError"></span>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Hifadhi mabadiliko</button>
        <button type="button" class="btn-ghost" onclick="document.getElementById('editModal').hidden = true">Ghairi</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  // Bidhaa inayohaririwa kwa sasa (id yake tu, popup moja tunaitumia kwa bidhaa zote)
  var editingProductId = null;

  // HATUA 1: mara ukurasa unapopakia, chukua bidhaa na kategoria kwa fetch()
  document.addEventListener('DOMContentLoaded', function(){
    loadProducts();
    loadCategoriesIntoDropdown();
  });

  // Inaomba orodha ya bidhaa kwa API, kisha kuijenga kwenye jedwali
  function loadProducts(){
    fetch('/admin/api/products')
      .then(function(res){ return res.json(); })
      .then(function(products){ renderProductRows(products); })
      .catch(function(){
        document.getElementById('productTableBody').innerHTML =
          '<tr><td colspan="6">Imeshindwa kupakia bidhaa. Jaribu kureload ukurasa.</td></tr>';
      });
  }

  // Inachukua orodha ya bidhaa (JSON) na kutengeneza mistari (<tr>) ndani ya jedwali
  function renderProductRows(products){
    var tbody = document.getElementById('productTableBody');

    if(products.length === 0){
      tbody.innerHTML = '<tr><td colspan="6">Hakuna bidhaa bado.</td></tr>';
      return;
    }

    var html = '';
    products.forEach(function(p){
      html += '<tr id="row-' + p.id + '">';
      html += '<td><img class="prod-thumb" src="' + (p.image_url || 'https://placehold.co/60x60') + '"></td>';
      html += '<td>' + p.name + '</td>';
      html += '<td>' + p.category_name + '</td>';
      html += '<td>Tsh ' + Number(p.price).toLocaleString() + '</td>';
      html += '<td>' + p.stock_quantity + '</td>';
      html += '<td>';
      html += '<button class="icon-btn" onclick=\'openEditModal(' + JSON.stringify(p) + ')\'>Hariri</button> ';
      html += '<button class="icon-btn danger" onclick="deleteProduct(' + p.id + ', \'' + p.name + '\')">Futa</button>';
      html += '</td>';
      html += '</tr>';
    });
    tbody.innerHTML = html;
  }

  // Inajaza <select> ya kategoria ndani ya popup ya kuhariri, kwa fetch()
  function loadCategoriesIntoDropdown(){
    fetch('/admin/api/categories')
      .then(function(res){ return res.json(); })
      .then(function(categories){
        var select = document.getElementById('editCategory');
        select.innerHTML = categories.map(function(c){
          return '<option value="' + c.id + '">' + c.name + '</option>';
        }).join('');
      });
  }

  // HATUA 2: kubonyeza "Hariri" kwenye mstari fulani - jaza fomu na ufungue popup
  function openEditModal(product){
    editingProductId = product.id;
    document.getElementById('editName').value = product.name;
    document.getElementById('editCategory').value = product.category_id;
    document.getElementById('editPrice').value = product.price;
    document.getElementById('editStock').value = product.stock_quantity;
    document.getElementById('editImage').value = product.image_url || '';
    document.getElementById('editModal').hidden = false;
  }

  // HATUA 3: kutuma fomu ya kuhariri -> PUT kwenda /admin/product/update/<id>
  document.getElementById('editForm').addEventListener('submit', function(e){
    e.preventDefault();

    var updatedProduct = {
      name: document.getElementById('editName').value,
      category_id: Number(document.getElementById('editCategory').value),
      price: Number(document.getElementById('editPrice').value),
      stock_quantity: Number(document.getElementById('editStock').value),
      image_url: document.getElementById('editImage').value
    };

    fetch('/admin/product/update/' + editingProductId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updatedProduct)
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      document.getElementById('editModal').hidden = true;
      loadProducts(); // pakia upya jedwali ili lionyeshe mabadiliko
    })
    .catch(function(){
      document.getElementById('editError').textContent = 'Imeshindwa kuhifadhi. Jaribu tena.';
    });
  });

  // Kufuta bidhaa - kwanza thibitisha kwa confirm() ya kawaida ya browser
  function deleteProduct(id, name){
    var sure = confirm('Una uhakika unataka kufuta "' + name + '"?');
    if(!sure) return;

    fetch('/admin/product/delete/' + id, { method: 'DELETE' })
      .then(function(res){ return res.json(); })
      .then(function(data){
        loadProducts(); // pakia upya jedwali baada ya kufuta
      })
      .catch(function(){
        alert('Imeshindwa kufuta bidhaa. Jaribu tena.');
      });
  }
</script>
{% endblock %}
